<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tablero ¿Quién es Quién?</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        
        <header>
            <div class="header-top">
                <h1>🕵️ ¿QUIÉN ES?</h1>
                <button id="resetBtn" class="btn-icon">↻</button>
            </div>
            
            <div class="controls">
                <select id="categorySelect">
                    </select>
            </div>
        </header>

        <section class="identity-section">
            <div class="identity-header">
                <span>TU PERSONAJE SECRETO</span>
                <button id="toggleIdentityBtn" class="btn-text">👁️ Mostrar</button>
            </div>
            
            <div id="secretCard" class="secret-card blur-active">
                <div class="secret-content">
                    <div id="secretAvatar" class="avatar large">?</div>
                    <div id="secretName" class="name">???</div>
                </div>
                <div class="blur-overlay">
                    <span>TOP SECRET</span>
                </div>
            </div>
            <button id="pickIdentityBtn" class="btn-main">🎲 Asignar Nuevo Personaje</button>
        </section>

        <main id="board" class="grid-board">
            </main>

    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
