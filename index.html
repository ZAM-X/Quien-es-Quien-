<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1d">
    <title>Tablero ¿Quién es Quién?</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="top-row">
            <div class="logo">
                <span class="icon">🕵️‍♂️</span>
                <h1>Tablero Virtual</h1>
            </div>
            <button id="resetBtn" class="btn-icon" aria-label="Reiniciar tablero">🔄</button>
        </div>
        
        <div class="controls-row">
            <select id="categorySelect" aria-label="Seleccionar categoría"></select>
        </div>

        <div class="identity-panel">
            <div id="hiddenState">
                <button id="assignBtn" class="btn-action">🎲 Obtener mi Carta</button>
            </div>
            
            <div id="revealedState" class="hidden">
                <div class="secret-card-mini">
                    <img id="secretImg" src="" alt="?">
                    <div class="secret-text">
                        <small>Tu personaje:</small>
                        <span id="secretName">Nombre</span>
                    </div>
                </div>
                <button id="toggleVisibilityBtn" class="btn-small">🙈 Ocultar</button>
            </div>
        </div>
    </header>

    <main>
        <div id="gameBoard" class="board">
            </div>
    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
